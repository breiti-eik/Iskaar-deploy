deploy: false

monitoring:
  enabled: false

components:
  database: true
  backend: true
  frontend: true
  tls: true

namespace: iskaar

image:
  registry: localhost:5000
  backend:
    name: iskaar-backend
    tag: latest  # Always overridden by the deployment script
  frontend:
    name: iskaar-frontend
    tag: latest  # Always overridden by the deployment script
  pullPolicy: IfNotPresent

backend:
  replicas: 1
  resources: {}

frontend:
  replicas: 1
  resources: {}

postgresql:
  existingSecret: ""
  createPlaceholderSecret: true
  replicas: 1
  storage:
    size: 1Gi

ingress:
  enabled: true
