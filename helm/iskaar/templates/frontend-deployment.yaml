apiVersion: apps/v1
kind: Deployment
metadata:
  name: iskaar-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: iskaar-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: iskaar
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: iskaar-frontend
      app.kubernetes.io/component: web
      app.kubernetes.io/part-of: iskaar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iskaar-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: iskaar
    spec:
      containers:
        - name: iskaar-frontend
          image: "{{ .Values.image.registry }}/{{ .Values.image.frontend.name }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          {{- if .Values.frontend.resources }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- end }}
