apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: monitoring
  labels:
    app: grafana
data:
  iskaar-overview.json: |
    {
      "uid": "iskaar-overview",
      "title": "Iskaar Overview",
      "tags": ["iskaar", "game"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "label": "Datasource"
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Game Metrics",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Active Games",
          "id": 2,
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "single" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "iskaar_games_active",
              "legendFormat": "Active Games"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Connected Players",
          "id": 3,
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "single" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "iskaar_players_connected",
              "legendFormat": "Connected Players"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "WebSocket Connections",
          "id": 4,
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "single" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "iskaar_websocket_connections_active",
              "legendFormat": "WebSocket Connections"
            }
          ]
        },
        {
          "type": "row",
          "title": "WebSocket",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "id": 5,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Message Throughput",
          "id": 6,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(iskaar_websocket_messages_received_total[1m])",
              "legendFormat": "Received/s"
            },
            {
              "refId": "B",
              "expr": "rate(iskaar_websocket_messages_sent_total[1m])",
              "legendFormat": "Sent/s"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Deserialization Errors",
          "id": 7,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "red" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "single" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(iskaar_games_deserialization_errors_total[5m])",
              "legendFormat": "Errors/s"
            }
          ]
        },
        {
          "type": "row",
          "title": "JVM",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "id": 8,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Heap Memory",
          "id": 9,
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "jvm_memory_used_bytes{area=\"heap\"}",
              "legendFormat": "Used"
            },
            {
              "refId": "B",
              "expr": "jvm_memory_max_bytes{area=\"heap\"}",
              "legendFormat": "Max"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Non-Heap Memory",
          "id": 10,
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "single" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "jvm_memory_used_bytes{area=\"nonheap\"}",
              "legendFormat": "Non-Heap Used"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "GC Pause Duration",
          "id": 11,
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 19 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "single" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "jvm_gc_pause_seconds",
              "legendFormat": "{{action}} - {{cause}}"
            }
          ]
        },
        {
          "type": "row",
          "title": "HTTP",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 },
          "id": 12,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Response Time Percentiles",
          "id": 13,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, rate(http_server_requests_seconds_bucket[5m]))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m]))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, rate(http_server_requests_seconds_bucket[5m]))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Request Rate by Status",
          "id": 14,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (status)",
              "legendFormat": "{{status}}"
            }
          ]
        }
      ]
    }
