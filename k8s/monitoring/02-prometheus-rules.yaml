apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: iskaar-alert-rules
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    app: iskaar-backend
spec:
  groups:
    - name: iskaar.rules
      rules:
        - alert: IskaarHighErrorRate
          expr: |
            (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m]))) > 0.05
            and sum(increase(http_server_requests_seconds_count[5m])) >= 10
          labels:
            severity: critical
            service: iskaar-backend
          annotations:
            summary: "IskaarHighErrorRate - HTTP 5xx error rate is {{ $value | humanizePercentage }}"
            description: "HTTP 5xx error rate exceeded 5% of total requests over the last 5 minutes (minimum 10 requests). Investigate backend logs for root cause of server errors."

        - alert: IskaarWebSocketConnectionDrop
          expr: |
            (iskaar_websocket_connections_active
            / iskaar_websocket_connections_active offset 2m) < 0.5
            and iskaar_websocket_connections_active offset 2m >= 4
          labels:
            severity: warning
            service: iskaar-backend
          annotations:
            summary: "IskaarWebSocketConnectionDrop - Active connections dropped by more than 50%"
            description: "WebSocket connections dropped by more than 50% within 2 minutes (previous count was at least 4). Investigate potential network issues or backend restarts."

        - alert: IskaarHighMemoryUsage
          expr: |
            (jvm_memory_used_bytes{area="heap"}
            / jvm_memory_max_bytes{area="heap"}) > 0.85
          for: 5m
          labels:
            severity: warning
            service: iskaar-backend
          annotations:
            summary: "IskaarHighMemoryUsage - Heap usage is {{ $value | humanizePercentage }}"
            description: "JVM heap memory usage exceeded 85% of maximum heap size for more than 5 minutes. Investigate memory leaks or consider increasing heap size."

        - alert: IskaarDeserializationFailures
          expr: |
            increase(iskaar_games_deserialization_errors_total[5m]) > 3
          labels:
            severity: critical
            service: iskaar-backend
          annotations:
            summary: "IskaarDeserializationFailures - {{ $value }} deserialization errors in 5 minutes"
            description: "More than 3 game deserialization errors occurred within 5 minutes. Investigate client payload format or backend serialization logic."

        - alert: IskaarServiceDown
          expr: up{job="iskaar-backend"} == 0
          for: 1m
          labels:
            severity: critical
            service: iskaar-backend
          annotations:
            summary: "IskaarServiceDown - Iskaar backend is unreachable"
            description: "The Iskaar backend health endpoint returned non-200 status for more than 1 minute. Check pod status, readiness probes, and deployment logs."

        - alert: IskaarScrapeFailure
          expr: up{job="iskaar-backend"} == 0
          for: 2m
          labels:
            severity: warning
            service: iskaar-backend
          annotations:
            summary: "IskaarScrapeFailure - No successful Prometheus scrape for over 2 minutes"
            description: "No successful Prometheus scrape occurred for more than 2 minutes. Check if the /actuator/prometheus endpoint is accessible and the pod is running."
