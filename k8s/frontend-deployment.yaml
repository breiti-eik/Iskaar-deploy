apiVersion: apps/v1
kind: Deployment
metadata:
  name: iskaar-frontend
  namespace: iskaar
  labels:
    app.kubernetes.io/name: iskaar-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: iskaar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iskaar-frontend
      app.kubernetes.io/component: web
      app.kubernetes.io/part-of: iskaar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iskaar-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: iskaar
    spec:
      containers:
        - name: iskaar-frontend
          image: iskaar-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_HOST
              value: "iskaar-backend.iskaar.svc.cluster.local"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
