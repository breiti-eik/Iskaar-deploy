apiVersion: apps/v1
kind: Deployment
metadata:
  name: iskaar-backend
  namespace: iskaar
  labels:
    app.kubernetes.io/name: iskaar-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: iskaar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iskaar-backend
      app.kubernetes.io/component: api
      app.kubernetes.io/part-of: iskaar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iskaar-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: iskaar
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              TIMEOUT=60
              ELAPSED=0
              until nc -z postgresql.iskaar.svc.cluster.local 5432; do
                ELAPSED=$((ELAPSED + 2))
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "Timeout: PostgreSQL not reachable after ${TIMEOUT}s"
                  exit 1
                fi
                echo "PostgreSQL not ready, retrying in 2s... (${ELAPSED}s/${TIMEOUT}s)"
                sleep 2
              done
              echo "PostgreSQL is available!"
      containers:
        - name: iskaar-backend
          image: iskaar-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgresql.iskaar.svc.cluster.local:5432/iskaar"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: SPRING_PROFILES_ACTIVE
              value: "local,docker"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
