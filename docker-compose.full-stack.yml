services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iskaar
      POSTGRES_USER: iskaar
      POSTGRES_PASSWORD: iskaar
    volumes:
      - iskaar_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iskaar -d iskaar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../iskaarBE/iskaar-be
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iskaar
      SPRING_DATASOURCE_USERNAME: iskaar
      SPRING_DATASOURCE_PASSWORD: iskaar
      SPRING_PROFILES_ACTIVE: local,docker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../iskaarFE/iskaar-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  iskaar_data:
